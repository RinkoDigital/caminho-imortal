<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;}
  .icon{
    width:512px;height:512px;
    background:
      radial-gradient(circle at 32% 28%, rgba(63,158,121,0.35), transparent 55%),
      radial-gradient(circle at 75% 80%, rgba(205,168,95,0.18), transparent 55%),
      #0a0f0d;
    display:flex;align-items:center;justify-content:center;
  }
  .emblem{
    width:340px;height:340px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 35% 30%, #8fd3b3, #2d7a5c 70%);
    box-shadow:0 0 0 14px rgba(63,158,121,0.14), 0 0 0 28px rgba(205,168,95,0.10);
  }
  .glyph{
    font-family:"Noto Serif CJK SC","Noto Serif SC",serif;
    font-weight:900;
    font-size:190px;
    color:#08130f;
    line-height:1;
  }
</style>
</head>
<body>
  <div class="icon"><div class="emblem"><div class="glyph">道</div></div></div>
</body>
</html>
